[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-employee"
version = "2.0.0a1"
description = "Dependable Engineering Delegation System (TaskContract + Sandbox Loop + Fail-to-Pass Evidence Gate)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.12.5",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
de = "digital_employee.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_employee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
